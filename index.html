<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3eb">
  <meta name="description" content="المنيو الإلكتروني للمقهى.">
  <title>المنيو</title>
  <link rel="icon" id="site-icon">
  <link rel="stylesheet" href="styles.css">
  <script src="cafe-config.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="masthead">
      <div class="brand-row">
        <a class="brand" id="brand" href="#top">
          <span class="brand-mark">
            <svg id="default-logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M10 14h18v12a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7V14Zm18 4h3a4 4 0 0 1 0 8h-3M15 8v3m7-3v3m7-3v3"/><path d="M14 19h10"/></svg>
            <img class="brand-logo" id="brand-logo" alt="" hidden>
          </span>
          <span class="brand-name"><span id="brand-name"></span> <span id="brand-descriptor"></span></span>
        </a>
        <span class="open-note"><i aria-hidden="true"></i> <span id="header-note"></span></span>
      </div>
      <section class="hero" id="top" aria-label="PLANT LEAF Coffee">
        <img class="hero-banner" src="images/hero-banner.svg" alt="PLANT LEAF Coffee">
        <button class="offer-button" id="offer-button" type="button" aria-haspopup="dialog" hidden>
          <span aria-hidden="true">🔥</span> عرض اليوم
        </button>
      </section>
    </header>

    <section class="menu-section" aria-labelledby="menu-heading">
      <div class="section-heading">
        <div>
          <p class="eyebrow" id="menu-eyebrow"></p>
          <h2 id="menu-heading"></h2>
        </div>
        <span class="menu-count" id="menu-count" aria-live="polite"></span>
      </div>

      <div class="category-tabs" role="tablist" aria-label="أقسام المنيو">
        <button class="category-tab is-active" id="hot-tab" type="button" role="tab" aria-selected="true" aria-controls="product-list" data-category="hot">
          <span class="tab-icon" aria-hidden="true">♨</span> المشروبات الساخنة
        </button>
        <button class="category-tab" id="cold-tab" type="button" role="tab" aria-selected="false" aria-controls="product-list" data-category="cold" tabindex="-1">
          <span class="tab-icon cold-icon" aria-hidden="true">❄</span> المشروبات الباردة
        </button>
        <button class="category-tab" id="desserts-tab" type="button" role="tab" aria-selected="false" aria-controls="product-list" data-category="desserts" tabindex="-1">
          <span class="tab-icon" aria-hidden="true">🍰</span> الحلويات
        </button>
        <button class="category-tab" id="breakfast-tab" type="button" role="tab" aria-selected="false" aria-controls="product-list" data-category="breakfast" tabindex="-1">
          <span class="tab-icon" aria-hidden="true">🍳</span> الفطور
        </button>
      </div>

      <div class="product-grid" id="product-list" role="tabpanel" aria-labelledby="hot-tab"></div>
    </section>

    <footer class="page-footer">
      <div class="footer-slogan"><span id="footer-slogan"></span><span class="footer-bean" aria-hidden="true">✳</span></div>
      <div class="footer-info" id="footer-info" hidden>
        <p id="cafe-address" hidden></p>
        <p id="cafe-hours" hidden></p>
        <nav class="contact-links" id="contact-links" aria-label="معلومات التواصل"></nav>
      </div>
    </footer>
  </main>

  <dialog class="offer-modal" id="offer-modal" aria-labelledby="offer-name">
    <article class="offer-card">
      <button class="offer-close" id="offer-close" type="button" aria-label="إغلاق العرض">×</button>
      <p class="offer-eyebrow">🔥 عرض اليوم</p>
      <div class="offer-image-frame" id="offer-image-frame" hidden>
        <img class="offer-image" id="offer-image" alt="" hidden>
      </div>
      <h2 class="offer-name" id="offer-name"></h2>
      <div class="offer-prices">
        <s class="offer-original" id="offer-original"></s>
        <p class="offer-price" id="offer-price"></p>
      </div>
    </article>
  </dialog>

  <dialog class="product-preview" id="product-preview" aria-labelledby="preview-name">
    <article class="product-preview-card">
      <button class="preview-close" id="preview-close" type="button" aria-label="إغلاق المعاينة">×</button>
      <div class="preview-image-frame" id="preview-image-frame" hidden>
        <img class="preview-image" id="preview-image" alt="" hidden>
      </div>
      <div class="preview-content">
        <p class="preview-category" id="preview-category" hidden></p>
        <h2 class="preview-name" id="preview-name"></h2>
        <p class="preview-description" id="preview-description" hidden></p>
        <div class="preview-prices">
          <s class="preview-original" id="preview-original" hidden></s>
          <p class="preview-price" id="preview-price"></p>
        </div>
      </div>
    </article>
  </dialog>
</body>
</html>
